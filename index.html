<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dra. Maéli Julia Stentzler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream: #f7f3ee;
      --warm-white: #fdfaf7;
      --gold: #b8965a;
      --gold-light: #d4b07a;
      --gold-pale: #eddfc4;
      --dark: #1c1a18;
      --text: #3a3530;
      --muted: #8a7f76;
    }

    html, body {
      height: 100%;
      background: var(--cream);
      color: var(--text);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 24px 64px;
      gap: 0;
    }

    /* Decorative arc top */
    .arc {
      position: fixed;
      top: -160px;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      height: 320px;
      background: radial-gradient(ellipse at center top, var(--gold-pale) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    /* ── Avatar ── */
    .avatar-wrap {
      position: relative;
      width: 108px;
      height: 108px;
      margin-bottom: 20px;
      animation: fadeUp 0.8s ease both;
    }

    .avatar-ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      background: conic-gradient(var(--gold) 0deg, var(--gold-light) 90deg, var(--gold-pale) 180deg, var(--gold) 360deg);
      animation: spin 8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .avatar-inner {
      position: relative;
      width: 108px;
      height: 108px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid var(--cream);
      z-index: 1;
    }

    .avatar-inner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* ── Name & Title ── */
    .identity {
      text-align: center;
      margin-bottom: 8px;
      animation: fadeUp 0.8s 0.1s ease both;
    }

    .name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 0.02em;
      color: var(--dark);
      line-height: 1.1;
    }

    .name em {
      font-style: italic;
      color: var(--gold);
    }

    .title {
      margin-top: 6px;
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 24px;
      width: 100%;
      max-width: 300px;
      animation: fadeUp 0.8s 0.15s ease both;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-pale));
    }

    .divider::after {
      background: linear-gradient(to left, transparent, var(--gold-pale));
    }

    .divider-gem {
      width: 6px;
      height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
    }

    /* ── Tags ── */
    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 28px;
      max-width: 320px;
      animation: fadeUp 0.8s 0.2s ease both;
    }

    .tag {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gold);
      border: 1px solid var(--gold-pale);
      padding: 5px 12px;
      border-radius: 100px;
      background: rgba(184,150,90,0.05);
    }

    /* ── Links ── */
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 340px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 22px;
      border-radius: 100px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 400;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      animation: fadeUp 0.8s ease both;
    }

    .link-btn:nth-child(1) { animation-delay: 0.25s; }
    .link-btn:nth-child(2) { animation-delay: 0.35s; }
    .link-btn:nth-child(3) { animation-delay: 0.45s; }

    .link-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(184,150,90,0.18);
    }

    .link-btn:active { transform: translateY(0); }

    /* WhatsApp */
    .btn-whatsapp {
      background: var(--dark);
      color: var(--gold-pale);
      border: 1px solid rgba(184,150,90,0.2);
    }

    .btn-whatsapp:hover { background: #2a2822; }

    /* Localização */
    .btn-location {
      background: var(--warm-white);
      color: var(--text);
      border: 1px solid var(--gold-pale);
    }

    .btn-location:hover { background: #fffdf9; }

    /* Instagram */
    .btn-instagram {
      background: linear-gradient(135deg, var(--gold) 0%, var(--gold-light) 100%);
      color: var(--warm-white);
      border: none;
    }

    .btn-instagram:hover {
      box-shadow: 0 8px 32px rgba(184,150,90,0.35);
    }

    .btn-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }

    .btn-label {
      flex: 1;
      text-align: center;
    }

    .btn-arrow {
      font-size: 0.75rem;
      opacity: 0.5;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 48px;
      text-align: center;
      animation: fadeUp 0.8s 0.55s ease both;
    }

    .footer-quote {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 0.95rem;
      color: var(--muted);
      line-height: 1.6;
      max-width: 260px;
    }

    .footer-line {
      margin-top: 20px;
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
